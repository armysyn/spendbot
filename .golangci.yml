version: "2"
linters:
  default: standard
  exclusions:
    rules:
      # HTTP and Telegram responses are best-effort; write errors are not interesting
      - linters: [errcheck]
        text: "(Write|Encode|Rollback|Close|Flush)"
      # in tests, setup is verified by the final assertions
      - linters: [errcheck]
        path: _test\.go
